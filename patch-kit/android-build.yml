name: CRIM-SYS 2026 — Android Build & Quality Control

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  JAVA_VERSION: "17"

# ──────────────────────────────────────────────────────
# Job 1: Quality Control (non-blocking) — web reference app
# ──────────────────────────────────────────────────────
jobs:
  quality:
    name: 🔍 Quality Control (web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true   # QC failures must NOT block the native build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - name: Install Dependencies
        run: bun install --frozen-lockfile
        timeout-minutes: 5

      - name: TypeScript Check
        run: bun tsc -b --noEmit
        timeout-minutes: 5
        continue-on-error: true

      - name: Lint
        run: bun run lint
        timeout-minutes: 5
        continue-on-error: true

      - name: Build Web (Verification Only)
        run: bun run build
        timeout-minutes: 5
        continue-on-error: true

  # ──────────────────────────────────────────────────────
  # Job 2: Native Android build (Kotlin + Compose module in android/)
  # ──────────────────────────────────────────────────────
  android:
    name: 🤖 Android Native Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      - name: Grant Gradle Permissions
        run: chmod +x android/gradlew

      - name: Build Debug APK (native module)
        run: |
          cd android
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
        timeout-minutes: 30
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

      - name: Verify APK Output
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK not found at $APK_PATH"
            exit 1
          fi
          echo "✅ Native debug APK built successfully"
          ls -lh "$APK_PATH"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CRIM-SYS-2026-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Build Summary
        if: always()
        run: |
          echo "## 📊 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web QC | ${{ needs.quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Native Build | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────
  # Job 3: JVM unit tests — real test verification (P1 gate).
  #        Focused sync-parity classes first (P1-A gate), then full suite.
  # ──────────────────────────────────────────────────────
  android-tests:
    name: 🧪 JVM Unit Tests (parity + full suite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      - name: Grant Gradle Permissions
        run: chmod +x android/gradlew

      - name: Focused Sync-Parity Tests
        working-directory: android
        timeout-minutes: 15
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests "net.crimsys.app.data.sync.QueueParityTest" \
            --tests "net.crimsys.app.data.sync.SyncOperationParityTest" \
            --tests "net.crimsys.app.data.sync.PayloadParityTest" \
            --tests "net.crimsys.app.data.sync.OperationMappingParityTest" \
            --tests "net.crimsys.app.data.sync.CrashConsistencyMatrixTest" \
            --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

      - name: Full JVM Test Suite
        working-directory: android
        timeout-minutes: 15
        run: |
          ./gradlew test \
            --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

      - name: Upload JVM Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
          retention-days: 14
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────
  # Job 4: Instrumented tests — Room migration 3→4 on a real emulator.
  #
  # P1-A fix (2026-09-19): this job previously started in PARALLEL with the
  # JVM job and raced it for the same :app module build directory
  # (ubuntu-latest runners do NOT share caches; both jobs executed a cold
  # assembleDebugAndroidTest for the same project). Run #131 shows the
  # symptom: emulator step consumed 21 minutes and failed with ZERO test
  # executions. The `needs: android-tests` serialization guarantees only one
  # job ever builds the module, and the emulator gets the full 45-minute
  # budget for boot + cold install instead of losing it to a build race.
  # ──────────────────────────────────────────────────────
  android-instrumentation:
    name: 📱 Instrumented Tests (Room migration on emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: android-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Grant Gradle Permissions
        run: chmod +x android/gradlew

      - name: Run RoomMigration3To4Test on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          script: cd android && ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=net.crimsys.app.data.local.RoomMigration3To4Test --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Diagnose Emulator Failure
        if: failure()
        run: |
          echo "## Emulator step failed — diagnostics" >> $GITHUB_STEP_SUMMARY
          ADB="$(adb devices 2>/dev/null | tail -n +2 | head -1 | cut -f1)"
          if [ -n "$ADB" ]; then
            adb -s "$ADB" emulator avd name || true
            adb -s "$ADB" shell getprop ro.build.version.sdk || true
            adb -s "$ADB" shell dumpsys package net.crimsys.app.debug 2>/dev/null | head -5 || true
            adb -s "$ADB" logcat -d -t 500 '*:E' > emulator-logcat.txt || true
          else
            echo "No device was ever attached — emulator failed to boot." >> $GITHUB_STEP_SUMMARY
          fi
          find android/app/build/outputs/androidTest-results android/app/build/reports/androidTests -type f 2>/dev/null | head -20 >> $GITHUB_STEP_SUMMARY || true

      - name: Upload Instrumentation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-reports
          path: |
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/androidTests/
            emulator-logcat.txt
          retention-days: 14
          if-no-files-found: warn
