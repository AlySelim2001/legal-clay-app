# ============================================================================
# legal-clay-app — CI: Security & Sanitation Pipeline
#
# Scope: the local-ai stack (Python microservices + hardened compose file).
# Goals:
#   1. Bandit security scan (SAST) — flags hardcoded secrets, unsafe calls.
#   2. Flake8 lint (with flake8-bandit rules). If flake8/bandit wheels are
#      unavailable for the runner's Python version, fall back to `ruff`,
#      which implements flake8 codes (E/F/W) and Bandit codes (S) natively.
#   3. Structural validation of the hardened compose topology: YAML parses,
#      every build context exists, and the fail-closed secret guards are
#      satisfiable (:? interpolation resolves with dummy values).
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    name: Bandit + Flake8 (local-ai services)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit flake8 flake8-bandit ruff

      - name: Bandit SAST (medium+ severity, fail on any finding)
        run: bandit -r local-ai/services -c .banditrc -lll

      - name: Flake8 (E9,F + Bandit S rules)
        run: flake8 local-ai/services --select=E9,F,S1,S3,S5,S6 --max-line-length=100

      - name: Ruff fallback gate (identical rules, used to pin behavior)
        if: always()
        run: ruff check local-ai/services --select E4,E7,E9,F,S --no-cache

  compose-validation:
    name: Hardened topology validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: YAML syntax
        run: python3 -c "import yaml,sys; yaml.safe_load(open('local-ai/docker-compose.yml')); print('compose YAML OK')"

      - name: Every build context must exist on disk
        run: |
          python3 - <<'PY'
          import yaml, pathlib, sys
          compose = yaml.safe_load(open("local-ai/docker-compose.yml"))
          missing = [
              svc["build"]["context"]
              for svc in compose["services"].values()
              if "build" in svc
              if not (pathlib.Path("local-ai") / svc["build"]["context"]).is_dir()
          ]
          if missing:
              sys.exit(f"missing build contexts: {missing}")
          print("all build contexts exist")
          PY

      - name: Secret guards satisfiable (fail-closed :? interpolation)
        run: |
          cd local-ai
          docker compose config --quiet \
            INTERNAL_API_KEY=$(openssl rand -hex 32) \
            QDRANT_API_KEY=$(openssl rand -hex 32) \
            N8N_ENCRYPTION_KEY=$(openssl rand -hex 32) \
            N8N_USER=ci N8N_PASSWORD=$(openssl rand -hex 16) \
            && echo "compose config resolves with dummy secrets"

      - name: Loopback-only published ports (resolved config)
        run: |
          cd local-ai
          docker compose config \
            INTERNAL_API_KEY=$(openssl rand -hex 32) \
            QDRANT_API_KEY=$(openssl rand -hex 32) \
            N8N_ENCRYPTION_KEY=$(openssl rand -hex 32) \
            N8N_USER=ci N8N_PASSWORD=$(openssl rand -hex 16) \
            > /tmp/resolved.yml
          python3 - <<'PY'
          import yaml, sys
          resolved = yaml.safe_load(open("/tmp/resolved.yml"))
          bad = []
          for name, svc in resolved.get("services", {}).items():
              for port in svc.get("ports") or []:
                  host_ip = port.get("host_ip") if isinstance(port, dict) else None
                  if host_ip != "127.0.0.1":
                      bad.append((name, port))
          if bad:
              sys.exit(f"ports not bound to 127.0.0.1: {bad}")
          print("all published ports bind 127.0.0.1")
          PY

      - name: Upstream image hygiene (no unpinned pulls, no non-existent images)
        run: |
          python3 - <<'PY'
          import yaml, sys
          compose = yaml.safe_load(open("local-ai/docker-compose.yml"))
          bad = []
          for name, svc in compose.get("services", {}).items():
              image = svc.get("image") or ""
              if not image or "build" in svc:
                  continue  # locally built or not image-based
              tag = image.rsplit(":", 1)[-1] if ":" in image.rsplit("/", 1)[-1] else ""
              if tag in ("", "latest"):
                  bad.append((name, image, "unpinned"))
              if "paddlepaddle/paddleocr" in image:
                  bad.append((name, image, "non-existent upstream image"))
          if bad:
              sys.exit(f"image hygiene violations: {bad}")
          print("upstream images pinned; no non-existent references")
          PY
