name: CRIM-SYS 2026 — Android Build & Quality Control

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  quality:
    name: 🔍 Quality Control
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript Check
        run: bun tsc -b --noEmit || echo "TS check failed (non-blocking)"

      - name: Lint
        run: bun run lint || echo "Lint warnings (non-blocking)"

      - name: Build Web
        run: bun run build

  android:
    name: 🤖 Android APK Build
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Web Application
        run: bun run build

      - name: Add Android Platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant Executable Permissions
        run: chmod +x android/gradlew

      - name: Compile Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CRIM-SYS-2026-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
