name: CRIM-SYS 2026 — Android Build & Quality Control

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  JAVA_VERSION: "17"

# ──────────────────────────────────────────────────────
# Job 1: Quality Control (non-blocking) — web reference app
# ──────────────────────────────────────────────────────
jobs:
  quality:
    name: 🔍 Quality Control (web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true   # QC failures must NOT block the native build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - name: Install Dependencies
        run: bun install --frozen-lockfile
        timeout-minutes: 5

      - name: TypeScript Check
        run: bun tsc -b --noEmit
        timeout-minutes: 5
        continue-on-error: true

      - name: Lint
        run: bun run lint
        timeout-minutes: 5
        continue-on-error: true

      - name: Build Web (Verification Only)
        run: bun run build
        timeout-minutes: 5
        continue-on-error: true

  # ──────────────────────────────────────────────────────
  # Job 2: Native Android build (Kotlin + Compose module in android/)
  #        Compiles every push and attaches a debug APK for manual testing.
  # ──────────────────────────────────────────────────────
  android:
    name: 🤖 Android Native Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      - name: Grant Gradle Permissions
        run: chmod +x android/gradlew

      - name: Build Debug APK (native module)
        run: |
          cd android
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
        timeout-minutes: 30
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

      - name: Verify APK Output
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK not found at $APK_PATH"
            exit 1
          fi
          echo "✅ Native debug APK built successfully"
          ls -lh "$APK_PATH"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CRIM-SYS-2026-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Build Summary
        if: always()
        run: |
          echo "## 📊 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web QC | ${{ needs.quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Native Build | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
