name: LAW-SYS 2026 — Android Build & Quality Control

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Verify or Add Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Build Web Application Bundle
        run: npm run build

      - name: Synchronize Web Assets to Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: |
          cd android
          chmod +x gradlew

      - name: Compile Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LAW-SYS-2026-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
