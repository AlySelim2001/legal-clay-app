name: CRIM-SYS — Android Build & Quality Control

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  NODE_VERSION: "20"
  JAVA_VERSION: "21"

jobs:
  quality:
    name: Quality Control
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
      - name: TypeScript Check (advisory)
        env:
          CI: "false"
        continue-on-error: true
        run: npx tsc -b --noEmit
      - name: Lint (advisory)
        env:
          CI: "false"
        continue-on-error: true
        run: npm run lint
      - name: Build Web Application
        env:
          CI: "false"
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E Tests
        run: npm test

  android:
    name: Android APK Build
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
      - name: Build Web Application
        env:
          CI: "false"
        run: npm run build
      - name: Ensure Android platform exists
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Grant Gradle permission
        run: chmod +x android/gradlew
      - name: Prepare optional release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No complete Android keystore secrets found; using the signed debug fallback."
          fi
      - name: Build signed release APK
        if: steps.keystore.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$ZIPALIGN" -f 4 "$APK" app-release-aligned.apk
          "$APKSIGNER" sign --ks ../release.keystore --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" --key-pass "pass:$ANDROID_KEY_PASSWORD" --out app-release-signed.apk app-release-aligned.apk
          mkdir -p app/build/outputs/apk/universal
          cp app-release-signed.apk app/build/outputs/apk/universal/legal-clay-app-${GITHUB_REF_NAME}-universal.apk
      - name: Build debug fallback APK
        if: steps.keystore.outputs.configured != 'true'
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          mkdir -p app/build/outputs/apk/universal
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/universal/legal-clay-app-${GITHUB_REF_NAME}-universal.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: legal-clay-app-${{ github.ref_name }}-universal-apk
          path: android/app/build/outputs/apk/universal/legal-clay-app-${{ github.ref_name }}-universal.apk
          if-no-files-found: error
          retention-days: 30
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/universal/legal-clay-app-${{ github.ref_name }}-universal.apk
          name: CRIM-SYS ${{ github.ref_name }}
          generate_release_notes: true
