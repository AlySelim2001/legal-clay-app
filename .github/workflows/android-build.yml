name: LAW-SYS 2026 — Android Build & Quality Control

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality-check:
    name: 🔍 Quality Control
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟡 Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🔎 TypeScript type check
        run: bun tsc -b --noEmit

      - name: 🧹 ESLint lint check
        run: bun run lint

      - name: 🏗️ Production web build
        run: bun run build

  android-build:
    name: 🤖 Android APK Build
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟡 Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: ☕ Setup Java 17 (OpenJDK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🏗️ Production web build
        run: bun run build

      - name: 📱 Sync Capacitor Android
        run: bunx cap sync android

      - name: 🔑 Grant Gradle wrapper execution rights
        run: chmod +x android/gradlew

      - name: 🏗️ Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: 📦 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LAW-SYS-2026-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

  notify:
    name: 📢 Build Summary
    needs: android-build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 📋 Print build summary
        run: |
          echo "## ✨ LAW-SYS 2026 — Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Quality Control | ${{ needs.quality-check.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android APK Build | ${{ needs.android-build.result == 'success' && '✅ Built' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📱 **Debug APK** is available as a downloadable artifact for 30 days." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **WhatsApp Support:** [wa.me/201119886662](https://wa.me/201119886662)" >> $GITHUB_STEP_SUMMARY
