name: CRIM-SYS 2026 — Release (signed APK)

# Tag-driven release: push a tag like `v2026.1.0` and this workflow builds,
# signature-verifies, and attaches the release APK + SHA256SUMS to a GitHub
# Release — the delivery channel for the closed beta (see docs/LAUNCH_STRATEGY.md).
#
# Optional secrets (release is signed only when they are set):
#   KEYSTORE_BASE64     — base64 of crimsys-release.jks
#   KEYSTORE_PASSWORD   — keystore password
#   KEY_ALIAS           — key alias
#   KEY_PASSWORD        — key password
# Without them the build intentionally FAILS after assembling, because an
# unsigned APK cannot be installed and must never reach users.

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: "17"

jobs:
  release:
    name: 🚀 Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      - name: Verify tag matches versionName
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts | head -1)
          TAG="${GITHUB_REF_NAME#v}"
          echo "versionName=$VERSION  tag=$TAG"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match app versionName $VERSION. Bump versionName in android/app/build.gradle.kts before tagging."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Restore signing keystore (optional secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/crimsys-release.jks
            cat > android/keystore.properties <<EOF
          storeFile=crimsys-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "✅ Signing keystore restored from secrets"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set — build will fail signature verification by design"
          fi

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
        timeout-minutes: 30

      - name: Verify signature (must be signed)
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          [ -f "$APK" ] || { echo "::error::$APK missing"; exit 1; }
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          if "$BT/apksigner" verify --print-certs "$APK"; then
            echo "✅ APK signature verified"
          else
            echo "::error::APK is not correctly signed. Set KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD repo secrets."
            exit 1
          fi

      - name: Checksums + publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          DIST="CRIM-SYS-${{ env.VERSION }}.apk"
          cp "$APK" "$DIST"
          sha256sum "$DIST" > SHA256SUMS.txt
          gh release create "${{ github.ref_name }}" \
            --title "CRIM-SYS ${{ env.VERSION }}" \
            --generate-notes \
            "$DIST" SHA256SUMS.txt
          echo "✅ Release published: $DIST"

      - name: Summary
        if: always()
        run: |
          echo "## 📊 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ env.VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
