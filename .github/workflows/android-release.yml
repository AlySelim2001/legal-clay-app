name: CRIM-SYS 2026 — Release (signed APK + AAB)

# Tag-driven release: push a tag like `v2026.1.0` and this workflow builds,
# signature-verifies, and attaches the release APK, AAB, SHA256SUMS, and the
# ProGuard mapping.txt to a GitHub Release — the delivery channel for the
# closed beta (see docs/LAUNCH_STRATEGY.md).
#
# The workflow can also be run manually (workflow_dispatch) from any branch;
# in that mode it only uploads build artifacts — no GitHub Release is created.
#
# Required secrets (build deliberately FAILS the signature check without them,
# because an unsigned APK can install nowhere and must never reach users):
#   KEYSTORE_BASE64     — base64 of crimsys-release.jks
#   KEYSTORE_PASSWORD   — keystore password
#   KEY_ALIAS           — key alias
#   KEY_PASSWORD        — key password
# Generate the base64 locally with:  base64 -w0 android/crimsys-release.jks

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: "17"

jobs:
  release:
    name: 🚀 Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      - name: Verify tag matches versionName (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts | head -1)
          TAG="${GITHUB_REF_NAME#v}"
          echo "versionName=$VERSION  tag=$TAG"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match app versionName $VERSION. Bump versionName in android/app/build.gradle.kts before tagging."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/crimsys-release.jks
            cat > android/keystore.properties <<EOF
          storeFile=crimsys-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "✅ Signing keystore restored from secrets"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set — build will fail signature verification by design"
          fi

      - name: Build Release APK + AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
        timeout-minutes: 30

      - name: Verify signatures (APK + AAB must be signed)
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          MAPPING="android/app/build/outputs/mapping/release/mapping.txt"
          [ -f "$APK" ] || { echo "::error::$APK missing"; exit 1; }
          [ -f "$AAB" ] || { echo "::error::$AAB missing"; exit 1; }
          [ -s "$MAPPING" ] || { echo "::error::$MAPPING missing or empty — R8 must have run (isMinifyEnabled)."; exit 1; }
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          if "$BT/apksigner" verify --print-certs "$APK"; then
            echo "✅ APK signature verified"
          else
            echo "::error::APK is not correctly signed. Set KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD repo secrets."
            exit 1
          fi
          if jarsigner -verify "$AAB" > /dev/null 2>&1; then
            echo "✅ AAB signature verified"
          else
            echo "::error::AAB is not correctly signed."
            exit 1
          fi
          echo "MAPPING=$MAPPING" >> "$GITHUB_ENV"

      - name: Upload build artifacts (incl. mapping.txt)
        uses: actions/upload-artifact@v4
        with:
          name: crimsys-release-${{ github.run_number }}
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt

      - name: Checksums + publish GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          DIST_APK="CRIM-SYS-${{ env.VERSION }}.apk"
          DIST_AAB="CRIM-SYS-${{ env.VERSION }}.aab"
          cp "$APK" "$DIST_APK"
          cp "$AAB" "$DIST_AAB"
          sha256sum "$DIST_APK" "$DIST_AAB" > SHA256SUMS.txt
          # mapping.txt is attached so every release's obfuscated stack traces
          # remain de-obfuscatable forever — it is unique per build.
          gh release create "${{ github.ref_name }}" \
            --title "CRIM-SYS ${{ env.VERSION }}" \
            --generate-notes \
            "$DIST_APK" "$DIST_AAB" SHA256SUMS.txt "$MAPPING"
          echo "✅ Release published: $DIST_APK + $DIST_AAB + mapping.txt"

      - name: Summary
        if: always()
        run: |
          echo "## 📊 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Ref | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ env.VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| APK | \`app-release.apk\` |" >> $GITHUB_STEP_SUMMARY
          echo "| AAB | \`app-release.aab\` (Google Play) |" >> $GITHUB_STEP_SUMMARY
          echo "| mapping.txt | archived in artifacts + release |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
