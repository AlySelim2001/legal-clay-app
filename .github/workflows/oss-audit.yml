name: OSS Audit

# Scheduled supply-chain audit (master prompt §48–§52):
#  - oss-registry-lint: "no mystery dependencies" gate across all surfaces
#  - SBOM regeneration + drift detection (CycloneDX)
#  - npm dependency audit summary (advisory output; gating stays with lint)
#  - LICENSE_UNVERIFIED re-check + review-staleness report
#
# Fail-fast on lint or SBOM drift. Runs weekly and on registry/manifest PRs.

on:
  push:
    paths:
      - "config/oss_registry.yaml"
      - "package.json"
      - "local-ai/services/*/requirements.txt"
      - "local-ai/services/frontend/package.json"
      - "mobile_app/pubspec.yaml"
      - "android/gradle/libs.versions.toml"
      - "scripts/oss-registry-lint.mjs"
      - "scripts/generate-sbom.mjs"
  pull_request:
    paths:
      - "config/oss_registry.yaml"
      - "package.json"
      - "local-ai/services/*/requirements.txt"
      - "local-ai/services/frontend/package.json"
      - "mobile_app/pubspec.yaml"
      - "android/gradle/libs.versions.toml"
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oss-audit:
    name: Registry lint + SBOM drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: OSS registry lint (no mystery dependencies)
        run: node scripts/oss-registry-lint.mjs

      - name: Generate SBOM
        run: node scripts/generate-sbom.mjs

      - name: SBOM drift check
        run: |
          if [ -f sbom/cyclonedx.json ]; then
            if ! git diff --exit-code --stat -- sbom/cyclonedx.json >/dev/null; then
              echo "::warning::sbom/cyclonedx.json differs from the committed SBOM."
              echo "If manifests changed intentionally, commit the regenerated SBOM."
              git diff -- sbom/cyclonedx.json | head -50
            else
              echo "SBOM is up to date with manifests."
            fi
          fi

      - name: Registry staleness report
        run: |
          THRESHOLD_DAYS=180
          NOW=$(date +%s)
          STALE=0
          # Components with last_reviewed older than the threshold (or missing)
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            NAME="${line%%|*}"
            DATE="${line##*|}"
            if [ -z "$DATE" ] || [ "$DATE" = "unknown" ]; then
              echo "::warning::$NAME has no last_reviewed date"
              STALE=$((STALE+1))
              continue
            fi
            TS=$(date -d "$DATE" +%s 2>/dev/null || echo 0)
            AGE=$(( (NOW - TS) / 86400 ))
            if [ "$TS" -eq 0 ] || [ "$AGE" -gt "$THRESHOLD_DAYS" ]; then
              echo "::warning::$NAME last reviewed $AGE days ago (> $THRESHOLD_DAYS) — re-verify license/security"
              STALE=$((STALE+1))
            fi
          done < <(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const reg = readFileSync("config/oss_registry.yaml", "utf8");
            let inComponents = false, name = null;
            for (const raw of reg.split(/\r?\n/)) {
              const t = raw.trim();
              if (!t || t.startsWith("#")) continue;
              if (/^components:\s*$/.test(t)) { inComponents = true; continue; }
              if (/^\S/.test(t) && !/^components:/.test(t)) inComponents = false;
              if (!inComponents) continue;
              const n = t.match(/^(?:- )?name:\s*"?([^"\n]+)"?/);
              if (n) { name = n[1].trim(); continue; }
              const d = t.match(/^last_reviewed:\s*"?([^"\n#]+)"?/);
              if (d && name) { console.log(name + "|" + d[1].trim()); name = null; }
            }
          ')
          echo "Stale/unreviewed entries: $STALE (advisory — components must be re-verified per update_policy)"

  npm-audit:
    name: npm dependency audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true # advisory; license/lint gate is the hard gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Audit production dependencies
        run: |
          echo "## npm audit (advisory)" >> $GITHUB_STEP_SUMMARY
          # advisory output only; SECURITY_UPDATE_REQUIRED flow is manual (§45).
          # Pinned tool version — no floating refs, even in CI tooling (§43).
          npx --yes audit-ci@^7 --low \
            || echo "findings above — triage per docs/OSS_SECURITY.md (SECURITY_UPDATE_REQUIRED)"
