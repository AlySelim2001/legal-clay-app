# ======================================================================
# CRIM-SYS frontend-ui — nginx sidecar
# Serves the built SPA and proxies /api/* to legal-backend-api,
# injecting X-Internal-Key SERVER-SIDE. The browser bundle never
# contains INTERNAL_API_KEY.
# ======================================================================
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache the shell so a11y/theme fixes ship immediately
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed static assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- Secure internal-API proxy ------------------------------------
    # The internal key lives only in this process's environment.
    location /api/ {
        proxy_pass http://legal-backend-api:8300/;
        proxy_http_version 1.1;
        proxy_set_header X-Internal-Key "${INTERNAL_API_KEY}";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # uploads (documents can be a few MB)
        client_max_body_size 12m;
        proxy_read_timeout 300s;   # LLM answers can be slow
        proxy_send_timeout 300s;
    }

    # Deny direct backend-style paths (defense in depth)
    location = /health { return 404; }
}
