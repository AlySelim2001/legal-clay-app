# Project-wide Gradle settings.

# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# Parallel project execution and configuration caching.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Use the AndroidX packages instead of the legacy support libraries.
android.useAndroidX=true

# Kotlin code style for this project: "official" is the standard Kotlin style.
kotlin.code.style=official

# Names of non-generated Gradle daemon processes (R8 memory headroom for release builds).
android.enableR8.fullMode=false

# Non-transitive R classes (faster builds, smaller APKs).
android.nonTransitiveRClass=true
