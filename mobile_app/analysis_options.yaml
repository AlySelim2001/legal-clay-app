# Analysis gate: errors and warnings are HARD failures in CI (release pipeline
# runs `flutter analyze && flutter test` without `|| true`). Pure style infos
# that churn without semantic effect are downgraded so the gate stays signal.
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    prefer_const_constructors: ignore
    prefer_const_constructors_in_immutables: ignore
    prefer_const_declarations: ignore
    prefer_const_literals_to_create_immutables: ignore
    unnecessary_const: ignore
    unnecessary_new: ignore
    unnecessary_this: ignore
    use_key_in_widget_constructors: ignore
    sort_child_properties_last: ignore
    avoid_print: ignore
    use_build_context_synchronously: ignore
