name: legal_clay
description: >-
  Legal Clay mobile client — Arabic-first, offline-first Flutter app for the
  Zero-Trust legal stack: dual-verified Egyptian deadline engine, fail-closed
  PII gate, SQLCipher encrypted storage, local-backend-only networking.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.3
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  path: ^1.9.0
  provider: ^6.1.2
  sqflite_sqlcipher: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
