name: legal_clay_mobile
description: >-
  Legal Clay App mobile client — offline-first, SQLCipher-encrypted,
  PII-gated legal assistant for Egyptian users (Arabic-first).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- Encrypted local persistence ---
  sqflite: ^2.4.1                 # Database/DAO types
  sqflite_sqlcipher: ^3.1.0       # AES-256 encrypted database opener
  path: ^1.9.0
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.4  # DB key lives in Android Keystore

  # --- Networking (Zero-Trust backend, https-only in release) ---
  dio: ^5.7.0
  crypto: ^3.1.3

  # --- Media / voice input-output ---
  camera: ^0.11.0+2
  speech_to_text: ^6.6.2
  flutter_tts: ^4.2.0

  # --- State / model equality / formatting ---
  provider: ^6.1.2
  equatable: ^2.0.7
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.3      # plain-sqlite FFI for offline DAO tests

flutter:
  uses-material-design: true
