name: legal_clay
description: >-
  Legal Clay mobile client — Arabic-first, offline-first Flutter app for the
  Zero-Trust legal stack: dual-verified Egyptian deadline engine, fail-closed
  PII gate, SQLCipher encrypted storage, local-backend-only networking.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  camera: ^0.11.0
  crypto: ^3.0.3
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  flutter_tts: ^4.0.2
  # Range tracks flutter_localizations' pinned intl across supported
  # Flutter versions (3.22 → 0.19.x, 3.27 → 0.20.x).
  intl: ">=0.19.0 <0.21.0"
  path: ^1.9.0
  path_provider: ^2.1.4
  provider: ^6.1.2
  speech_to_text: ^6.6.2
  sqflite: ^2.3.3
  sqflite_sqlcipher: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
