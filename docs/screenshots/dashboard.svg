<svg xmlns="http://www.w3.org/2000/svg" width="480" height="960" viewBox="0 0 480 960">
  <!-- CRIM-SYS 2026 — لوحة المؤشرات (placeholder) -->
  <defs>
    <filter id="clay" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#8a6f5c" flood-opacity="0.28"/>
    </filter>
    <filter id="claySm" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#8a6f5c" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F1EA"/>
      <stop offset="1" stop-color="#EFE6DC"/>
    </linearGradient>
  </defs>

  <rect width="480" height="960" rx="36" fill="url(#bg)"/>

  <!-- Top bar -->
  <rect x="24" y="24" width="432" height="72" rx="24" fill="#FDF9F4" filter="url(#claySm)"/>
  <circle cx="416" cy="60" r="16" fill="#E8D5C4"/>
  <text x="416" y="66" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#6B4F3A">⚖</text>
  <text x="390" y="66" font-family="sans-serif" font-size="19" font-weight="700" text-anchor="end" fill="#4A3728" direction="rtl">لوحة المؤشرات</text>
  <text x="70" y="65" font-family="sans-serif" font-size="12" text-anchor="start" fill="#B08968">CRIM-SYS 2026</text>

  <!-- KPI cards (2x2) -->
  <g filter="url(#clay)">
    <rect x="24" y="120" width="208" height="120" rx="24" fill="#FBEDE3"/>
    <text x="212" y="156" font-size="14" font-family="sans-serif" text-anchor="end" fill="#8A6F5C" direction="rtl">قضايا نشطة</text>
    <text x="212" y="204" font-size="40" font-weight="800" font-family="sans-serif" text-anchor="end" fill="#4A3728" direction="rtl">١٤٧</text>
  </g>
  <g filter="url(#clay)">
    <rect x="248" y="120" width="208" height="120" rx="24" fill="#EAF4EE"/>
    <text x="436" y="156" font-size="14" font-family="sans-serif" text-anchor="end" fill="#6F8A7B" direction="rtl">جلسات هذا الأسبوع</text>
    <text x="436" y="204" font-size="40" font-weight="800" font-family="sans-serif" text-anchor="end" fill="#2F4A3C" direction="rtl">٢٣</text>
  </g>
  <g filter="url(#clay)">
    <rect x="24" y="264" width="208" height="120" rx="24" fill="#FDF3D9"/>
    <text x="212" y="300" font-size="14" font-family="sans-serif" text-anchor="end" fill="#9C824D" direction="rtl">مواعيد حرجة</text>
    <text x="212" y="348" font-size="40" font-weight="800" font-family="sans-serif" text-anchor="end" fill="#7A5B1E" direction="rtl">٤</text>
  </g>
  <g filter="url(#clay)">
    <rect x="248" y="264" width="208" height="120" rx="24" fill="#F9E9E6"/>
    <text x="436" y="300" font-size="14" font-family="sans-serif" text-anchor="end" fill="#A06A5E" direction="rtl">بانتظار المزامنة</text>
    <text x="436" y="348" font-size="40" font-weight="800" font-family="sans-serif" text-anchor="end" fill="#8A4636" direction="rtl">٠</text>
  </g>

  <!-- Urgent deadlines card -->
  <g filter="url(#clay)">
    <rect x="24" y="408" width="432" height="260" rx="24" fill="#FDF9F4"/>
    <text x="432" y="446" font-size="16" font-weight="700" font-family="sans-serif" text-anchor="end" fill="#4A3728" direction="rtl">أقرب المواعيد النهائية</text>

    <circle cx="416" cy="486" r="8" fill="#C0392B"/>
    <text x="398" y="492" font-size="14" font-family="sans-serif" text-anchor="end" fill="#4A3728" direction="rtl">استئناف — ج‌ج ٢٠٢٦/٨٨</text>
    <text x="48" y="492" font-size="13" font-family="sans-serif" text-anchor="start" fill="#C0392B">باقي يومان</text>

    <circle cx="416" cy="536" r="8" fill="#F1C40F"/>
    <text x="398" y="542" font-size="14" font-family="sans-serif" text-anchor="end" fill="#4A3728" direction="rtl">مذكرة دفاع — ج‌ح ٢٠٢٦/١٤٧</text>
    <text x="48" y="542" font-size="13" font-family="sans-serif" text-anchor="start" fill="#B7950B">باقي ٦ أيام</text>

    <circle cx="416" cy="586" r="8" fill="#27AE60"/>
    <text x="398" y="592" font-size="14" font-family="sans-serif" text-anchor="end" fill="#4A3728" direction="rtl">تظلم — ج‌م ٢٠٢٦/٣٠٢</text>
    <text x="48" y="592" font-size="13" font-family="sans-serif" text-anchor="start" fill="#1E8449">باقي ٢١ يوماً</text>

    <!-- urgency legend -->
    <rect x="48" y="622" width="384" height="1.5" fill="#EADFD3"/>
    <circle cx="416" cy="646" r="5" fill="#C0392B"/>
    <text x="404" y="651" font-size="11" font-family="sans-serif" text-anchor="end" fill="#8A6F5C" direction="rtl">≤ ٣ أيام</text>
    <circle cx="312" cy="646" r="5" fill="#F1C40F"/>
    <text x="300" y="651" font-size="11" font-family="sans-serif" text-anchor="end" fill="#8A6F5C" direction="rtl">≤ ٧ أيام</text>
    <circle cx="208" cy="646" r="5" fill="#27AE60"/>
    <text x="196" y="651" font-size="11" font-family="sans-serif" text-anchor="end" fill="#8A6F5C" direction="rtl">&gt; ١٤ يوماً</text>
  </g>

  <!-- Upcoming session card -->
  <g filter="url(#clay)">
    <rect x="24" y="692" width="432" height="110" rx="24" fill="#EAF4EE"/>
    <text x="432" y="730" font-size="15" font-weight="700" font-family="sans-serif" text-anchor="end" fill="#2F4A3C" direction="rtl">الجلسة القادمة — غداً ٩:٠٠ ص</text>
    <text x="432" y="760" font-size="13" font-family="sans-serif" text-anchor="end" fill="#5F7A6C" direction="rtl">محكمة جنوب القاهرة الابتدائية — دائرة ١٧ جنايات</text>
    <text x="432" y="784" font-size="12" font-family="sans-serif" text-anchor="end" fill="#7E948A" direction="rtl">ج‌ج ٢٠٢٦/٨٨ — نقض ضد حكم غيابي</text>
  </g>

  <!-- Disclaimer -->
  <text x="240" y="880" font-size="12" font-family="sans-serif" text-anchor="middle" fill="#B08968" direction="rtl">نتائج تقديرية — تُراجع مع المحامي المختص</text>
  <text x="240" y="920" font-size="11" font-family="sans-serif" text-anchor="middle" fill="#C9AE93">لقطة توضيحية — تُستبدل بلقطة فعلية عند الإطلاق التجريبي المغلق</text>
</svg>
