<svg xmlns="http://www.w3.org/2000/svg" width="480" height="960" viewBox="0 0 480 960">
  <!-- CRIM-SYS 2026 — سجل القضايا (placeholder) -->
  <defs>
    <filter id="clay" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#8a6f5c" flood-opacity="0.28"/>
    </filter>
    <filter id="claySm" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#8a6f5c" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F1EA"/>
      <stop offset="1" stop-color="#EFE6DC"/>
    </linearGradient>
  </defs>

  <rect width="480" height="960" rx="36" fill="url(#bg)"/>

  <!-- Top bar -->
  <rect x="24" y="24" width="432" height="72" rx="24" fill="#FDF9F4" filter="url(#claySm)"/>
  <text x="432" y="66" font-family="sans-serif" font-size="19" font-weight="700" text-anchor="end" fill="#4A3728" direction="rtl">سجل القضايا</text>
  <text x="48" y="65" font-family="sans-serif" font-size="12" text-anchor="start" fill="#B08968">١٤٧ قضية</text>

  <!-- Search -->
  <g filter="url(#claySm)">
    <rect x="24" y="116" width="432" height="52" rx="20" fill="#FDF9F4"/>
    <circle cx="424" cy="142" r="9" fill="none" stroke="#B08968" stroke-width="2.5"/>
    <line x1="418" y1="148" x2="410" y2="156" stroke="#B08968" stroke-width="2.5" stroke-linecap="round"/>
    <text x="396" y="148" font-size="14" font-family="sans-serif" text-anchor="end" fill="#C9AE93" direction="rtl">ابحث برقم القضية أو اسم المتهم…</text>
  </g>

  <!-- Case rows -->
  <g filter="url(#clay)">
    <rect x="24" y="192" width="432" height="104" rx="24" fill="#FDF9F4"/>
    <circle cx="416" cy="228" r="8" fill="#C0392B"/>
    <text x="398" y="234" font-size="16" font-weight="700" font-family="sans-serif" text-anchor="end" fill="#4A3728" direction="rtl">ج‌ج ٢٠٢٦/٨٨</text>
    <text x="398" y="262" font-size="13" font-family="sans-serif" text-anchor="end" fill="#8A6F5C" direction="rtl">جنوب القاهرة الابتدائية — جنايات</text>
    <rect x="48" y="250" width="88" height="26" rx="13" fill="#F9E9E6"/>
    <text x="92" y="268" font-size="11" font-family="sans-serif" text-anchor="middle" fill="#8A4636" direction="rtl">استئناف قادم</text>
  </g>

  <g filter="url(#clay)">
    <rect x="24" y="316" width="432" height="104" rx="24" fill="#FDF9F4"/>
    <circle cx="416" cy="352" r="8" fill="#F1C40F"/>
    <text x="398" y="358" font-size="16" font-weight="700" font-family="sans-serif" text-anchor="end" fill="#4A3728" direction="rtl">ج‌ح ٢٠٢٦/١٤٧</text>
    <text x="398" y="386" font-size="13" font-family="sans-serif" text-anchor="end" fill="#8A6F5C" direction="rtl">محكمة الجيزة الابتدائية — جنح</text>
    <rect x="48" y="374" width="88" height="26" rx="13" fill="#FDF3D9"/>
    <text x="92" y="392" font-size="11" font-family="sans-serif" text-anchor="middle" fill="#7A5B1E" direction="rtl">مذكرة قيد الإعداد</text>
  </g>

  <g filter="url(#clay)">
    <rect x="24" y="440" width="432" height="104" rx="24" fill="#FDF9F4"/>
    <circle cx="416" cy="476" r="8" fill="#27AE60"/>
    <text x="398" y="482" font-size="16" font-weight="700" font-family="sans-serif" text-anchor="end" fill="#4A3728" direction="rtl">ج‌م ٢٠٢٦/٣٠٢</text>
    <text x="398" y="510" font-size="13" font-family="sans-serif" text-anchor="end" fill="#8A6F5C" direction="rtl">محكمة شمال القاهرة الابتدائية — جنح</text>
    <rect x="48" y="498" width="88" height="26" rx="13" fill="#EAF4EE"/>
    <text x="92" y="516" font-size="11" font-family="sans-serif" text-anchor="middle" fill="#2F4A3C" direction="rtl">حالة مستقرة</text>
  </g>

  <g filter="url(#clay)">
    <rect x="24" y="564" width="432" height="104" rx="24" fill="#FDF9F4"/>
    <circle cx="416" cy="600" r="8" fill="#27AE60"/>
    <text x="398" y="606" font-size="16" font-weight="700" font-family="sans-serif" text-anchor="end" fill="#4A3728" direction="rtl">ج‌ن ٢٠٢٥/٤٦</text>
    <text x="398" y="634" font-size="13" font-family="sans-serif" text-anchor="end" fill="#8A6F5C" direction="rtl">محكمة النقض — الطعن رقم ٥٦٠٠</text>
    <rect x="48" y="622" width="88" height="26" rx="13" fill="#EAF4EE"/>
    <text x="92" y="640" font-size="11" font-family="sans-serif" text-anchor="middle" fill="#2F4A3C" direction="rtl">بانتظار الجلسة</text>
  </g>

  <!-- FAB -->
  <g filter="url(#clay)">
    <circle cx="404" cy="856" r="34" fill="#4A3728"/>
    <text x="404" y="868" font-size="30" font-weight="700" font-family="sans-serif" text-anchor="middle" fill="#FDF9F4">+</text>
  </g>

  <text x="240" y="920" font-size="11" font-family="sans-serif" text-anchor="middle" fill="#C9AE93" direction="rtl">لقطة توضيحية — بيانات وهمية بالكامل</text>
</svg>
