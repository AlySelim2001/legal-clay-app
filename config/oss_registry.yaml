# -----------------------------------------------------------------------------
# REJECTED CANDIDATES — documented so nobody re-proposes them (full reasoning
# in docs/dependency-decisions.md §wishlist manifest → disposition)
# -----------------------------------------------------------------------------
rejected:
  - name: langchain
    reason: heavyweight; project's own hybrid retriever (src/rag/*) is auditable and Arabic-aware
  - name: ethers
    reason: replaced by dependency-free signer (src/blockchain/document-verification.ts)
  - name: neo4j-driver
    reason: requires bolt server; in-memory knowledge graph facade suffices
  - name: "@tensorflow/tfjs"
