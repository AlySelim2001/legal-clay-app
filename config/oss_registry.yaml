# =============================================================================
# OSS REGISTRY — CRIM-SYS 2026 (Egyptian Legal AI)
# =============================================================================
# Machine-readable source of truth for every open-source component integrated
# in this repository. Human-readable view: docs/OSS_REGISTRY.md
#
# GATE: scripts/oss-registry-lint.mjs fails CI when a direct dependency in any
# manifest (package.json, local-ai/services/*/package.json, mobile_app/pubspec.yaml,
# local-ai/services/*/requirements.txt, android/gradle/libs.versions.toml,
# docker images) is absent from `components` AND unmatched by `default_licenses`.
#
# Fields per component:
#   name, surface, version, license (SPDX), tier (1-6), type (A-L),
#   purpose, origin (repo URL), update_policy, security_notes, review (date)
#
# Integration types (docs/OSS_REGISTRY.md §types):
#   A dependency · B library · C service · D reference implementation
#   E code extract · F dev tool · G agent skill · H dataset · I model
#   J UI component · K docker service · L optional plugin

policy:
  project: CRIM-SYS 2026 (legal-clay-app)
  distribution_model: open web app (browser SPA) + local self-hosted services + mobile clients
  license_preferences:
    preferred: [MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, CC0-1.0]
    evaluate:  [GPL-3.0, AGPL-3.0, LGPL-3.0, EPL-2.0, MPL-2.0]
    restricted:
      - license: Sustainable Use License
        component: n8n
        note: >-
          fair-code, NOT OSI-approved. Permitted as a self-hosted Docker
          service (internal automation only) — never redistributed or
          offered as a hosted service to third parties. Tracked here so
          the restriction stays visible. Flagged in docs/OSS_LICENSES.md.
  license_unverified_action: REJECT_FOR_PRODUCTION
  # Group-prefix license facts for maven artifacts (kept OUT of components/
  # default_licenses because the lint trusts these prefixes by project policy;
  # the SBOM still wants their licenses). Evidence per group:
  #   androidx.*            — every AndroidX artifact ships under Apache-2.0
  #                           (developer.android.com/jetpack licensing)
  #   org.jetbrains.kotlin* — kotlin stdlib/coroutines/serialization: Apache-2.0
  #   io.mockk, app.cash.turbine, com.google.dagger, com.google.devtools.ksp,
  #   com.google.firebase   — Apache-2.0 upstream projects
  #   junit                 — EPL-1.0 (junit4/junit5)
  # NOT covered (non-OSI, tracked as components): Google ML Kit terms.
  license_group_policy:
    - group_prefix: "androidx."
      license: Apache-2.0
    - group_prefix: "org.jetbrains.kotlin"
      license: Apache-2.0
    - group_prefix: "io.mockk"
      license: Apache-2.0
    - group_prefix: "app.cash.turbine"
      license: Apache-2.0
    - group_prefix: "com.google.dagger"
      license: Apache-2.0
    - group_prefix: "com.google.devtools.ksp"
      license: Apache-2.0
    - group_prefix: "com.google.firebase"
      license: Apache-2.0
    - group_prefix: "junit"
      license: EPL-1.0
  # Per-package PyPI license facts for production pins. Kept here (not as
  # py:* components) because the lint gates these via its pinned-package
  # allowlist; licenses verified at registration — see docs/OSS_LICENSES.md
  # §python. SBOM enrichment consumes this block.
  license_pypi:
    httpx: BSD-3-Clause
    python-multipart: Apache-2.0
    pillow: MIT-CMU
    crewai-tools: MIT
    langchain-ollama: MIT
    llama-index-embeddings-huggingface: MIT
    llama-index-vector-stores-qdrant: MIT
    qdrant-client: MIT
    sentence-transformers: Apache-2.0
    torch: BSD-3-Clause
    datasets: Apache-2.0
    paddlepaddle: Apache-2.0
    opencv-python-headless: Apache-2.0
  update_policies: [MANUAL, MONTHLY, QUARTERLY, SECURITY_ONLY, PINNED, AUTO_UPDATE_TEST_ONLY]
  default_update_policy: SECURITY_ONLY
  supply_chain:
    no_floating_refs: true        # no 'latest'/main git deps in prod
    pin_direct: true              # direct deps pinned in manifests
    sbom: scripts/generate-sbom.mjs   # CycloneDX JSON at sbom/cyclonedx.json
    sandbox_required_for: [D, E, G]   # sandbox/oss/<name>/ before integration
  scoring:
    weights: {architecture: 15, security: 20, license: 15, maintenance: 10,
              quality: 10, testing: 10, performance: 5, mobile: 5,
              docs: 5, community: 5}
    auto_reject_on: [security_failure, license_failure]

